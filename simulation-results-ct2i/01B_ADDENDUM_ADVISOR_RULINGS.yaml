  added_by: AMENDMENT-3
  date: 2026-08-24
  count: 1
  R1:
    title: "Phase A0 criterion C2: the CONFIRMED status is partially retracted — its premise, not its conclusion"
    what_was_delivered_to_the_advisor: >
      The Phase A0 council record delivered criterion C2 to the advisor as
      CONFIRMED: that the uncertainty scheme was anti-conservative BECAUSE the
      48 scenario pairs "cluster into 8 parameter-draw blocks", with
      `seed.nunique() == 400 == 8 blocks x 50 replicates` cited as the
      confirming measurement. D13 was ruled on that record.
    what_is_retracted:
      - "the premise: that there are 8 independent parameter draws. There are 400 — one per (block, replicate). Parameters are drawn afresh for every replicate."
      - "the evidence line: `seed.nunique() == 400` was read as confirming 8 draws. It measures 400 DISTINCT PARAMETER DRAWS and therefore REFUTES the premise it was cited for."
      - "the remedy that followed from the premise: collapse to 8 block means with 7 df."
    what_is_NOT_retracted:
      - "the narrow conclusion that `sd/sqrt(48)`, and any per-scenario denominator, UNDERSTATES the standard error. The 48 scenario means ARE clustered — 6 scenarios share every parameter draw. That finding stands."
      - "the finding that the block key's exclusion of delta_eta and n_train is correct and is what keeps the within-DGP contrasts paired. Confirmed by measurement at exactly 0.0."
      - "any other A0 criterion. This retraction is scoped to C2's premise and to the inference drawn from it."
    proof_of_the_retraction: rulings.D13.premise_refuted_at_A0_1
    sites_carrying_the_retracted_premise:
      note: >
        Listed so the advisor can see every place the false premise reached him.
        Line numbers are as of 2026-08-24.
      immutable_A0_record_NOT_EDITED:
        - "S0A_ADDENDUM_COUNCIL_REVIEW.md:62 — the C2 row: 'they cluster into 8 parameter-draw blocks' and 'CONFIRMED. seed.nunique() == 400 == 8 blocks x 50 replicates'"
        - "S0A_ADDENDUM_COUNCIL_REVIEW.md:229 — the long C2 paragraph. Its OWN closing argument ('sd across a fixed, exhaustively enumerated factorial grid is designed heterogeneity, not Monte Carlo error; calling it MCSE mislabels it') refutes its own remedy, because it applies verbatim to the 8 block means."
        - "S0A_ADDENDUM_PREFLIGHT_REPORT.md:43 — criterion C2 statement"
        - "S0A_ADDENDUM_PREFLIGHT_REPORT.md:47 — 'corrected to block-clustered inference on 8 blocks (7 df)'"
        - "S0A_ADDENDUM_PREFLIGHT_REPORT.md:317 — the seed.nunique() == 400 evidence line"
        - "S0A_ADDENDUM_PREFLIGHT_REPORT.md:333 — 'Adopted correction (D13): cluster-robust inference on the 8 blocks (7 df)'"
        - "S0A_ADDENDUM_PREFLIGHT_REPORT.md:606 — the C2 summary row: 'there are only 8 blocks'"
      why_the_S0A_files_are_not_edited: >
        Prohibition PR3 and the advisor's own instruction — "Do not overwrite or
        erase the A0 freeze or council record" — are ABSOLUTE. The A0 record is
        the evidence of WHAT HE WAS TOLD when he ruled; editing it would destroy
        the only trace of why D13 says what it says, and would make the
        correction unauditable. It is corrected BY REFERENCE from this file, in
        the same way 01A is corrected by reference, and for the same reason.
      A0_1_files_that_may_be_and_should_be_corrected:
        - path: "S0B_ADVISOR_RULING_IMPLEMENTATION_REPORT.md:28"
          text: "the section heading 'D13 — block-clustered inference on 8 blocks, 7 df'"
          status: NOT_CORRECTED_BY_THIS_WORK_ITEM
          reason: >
            This work item is scoped to 01B_ADDENDUM_ADVISOR_RULINGS.yaml alone
            and a sibling A0.1 work item is concurrently editing other files.
            The site is named here so it is not lost. It is an A0.1 product, not
