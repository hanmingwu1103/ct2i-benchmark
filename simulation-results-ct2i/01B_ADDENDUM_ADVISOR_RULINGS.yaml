# -----------------------------------------------------------------------------
# The advisor ruling, embedded VERBATIM so the repository carries the source of
# every rule below. Reproduced without edit, elision or reordering.
# -----------------------------------------------------------------------------
advisor_ruling_verbatim:
  received: 2026-08-21
  transcription: EXACT_NO_EDITS
  text: |
    The advisor has reviewed the Phase A0 council findings.

    Do not execute the full dense-signal addendum yet.

    Create and execute a new Phase A0.1:
    ADVISOR-RULING AMENDMENT AND A1 RUNNER GATE.

    The advisor rulings are binding:

    D13 — ACCEPT.
    Use block-clustered inference on the 8 independent parameter-draw blocks
    with 7 degrees of freedom. Use block-resampling bootstrap. Never treat the
    48 scenarios or 2,400 replicates as independent inferential units. State the
    effective number of blocks and duplicated conditions for every reported
    quantity.

    D14 — ACCEPT OPTION 1 WITH NARROWED INTERPRETATION.
    Keep the inherited d=5 DGP unchanged. Do not divide tau by sqrt(d) and do
    not add a third signal-matched arm.

    The addendum is a DENSE-SIGNAL STRESS TEST, not a pure dimensionality-effect
    experiment.

    Report both:
    1. raw absolute risk gaps; and
    2. signal-normalized gaps.

    Use the prespecified normalized quantities:

      relative_log_gap =
        (R_log^*(Z) - R_log^*(X)) /
        (H(Y) - R_log^*(X))

      relative_brier_gap =
        (R_Brier^*(Z) - R_Brier^*(X)) /
        Var{eta(X)}

    When a denominator is below a frozen numerical tolerance, record
    NOT_IDENTIFIED, never zero.

    Report interaction_pairs=0 and interaction_pairs=3 separately. Retain and
    prominently disclose the total-signal-strength, interaction-saturation, and
    interaction-placement confounds. No d=5 minus d=3 result may be called a
    pure dimensionality effect. The normalized analysis is a sensitivity analysis
    and must not be described as fully removing confounding.

    D15 — ACCEPT.
    Extend the addendum raw-freeze manifest to contain SHA-256 values for every
    protected raw CSV and every new raw addendum output. Rewrite AD10 to name
    its exact coverage. A line-count check is insufficient.

    D16 — ACCEPT WITH THE FOLLOWING FROZEN DECISION RULES.
    Split E1 into three clauses:

    E1a hash_shared:
    - collapse B0/B1/B2 to one piece of evidence because their partitions are
      identical;
    - primary statistic: block-clustered d=5 minus d=3 relative log-loss gap;
    - relative Brier gap is the parallel supporting statistic.

    E1b hash_column:
    - primary narrow-width statistic averages B0 and B1 within scenario/block;
    - report B0, B1, and B2 separately as secondary results.

    E1c count:
    - record fiber_count in every cell;
    - primary analysis includes only matched conditions in which both d=3 and
      d=5 mappings are non-injective, fiber_count < 1024;
    - report all other cells separately;
