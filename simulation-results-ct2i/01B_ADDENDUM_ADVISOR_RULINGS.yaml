# -----------------------------------------------------------------------------
# QUESTIONS FOR THE ADVISOR — he is asked to confirm or overrule each.
#
# Q1 was open from the start. Q2-Q5 were PROMOTED here on 2026-08-24 by
# AMENDMENT-2. Q2, Q3 and Q4 were previously frozen deep inside this file with
# written justification; each EXTENDS a decision rule the advisor wrote himself,
# so burying it was the wrong call. Q5 is AMENDMENT-1.
#
# EVERY question keeps its frozen value as the OPERATIVE DEFAULT. Nothing here
# is waiting on an answer to proceed; each is waiting on an answer to be
# LEGITIMATE.
# -----------------------------------------------------------------------------
advisor_confirmation_requested:
  status: OPEN_ADOPTED_READINGS_NOT_SETTLED_DECISIONS
  count: 8
  promoted_at: 2026-08-24
  promoted_by: [AMENDMENT-2, AMENDMENT-3, AMENDMENT-4, AMENDMENT-5]
  highest_priority: Q6
  this_file_is_the_single_authority_for_question_numbering: >
    ADDED BY AMENDMENT-5. The labels Q1-Q8 mean what THIS list says they mean,
    everywhere in the package. No other document may introduce its own Qn
    scheme. S0B_ADVISOR_RULING_IMPLEMENTATION_REPORT.md previously numbered its
    own open items Q1-Q8 and collided with this list on the label Q6 — its Q6
    was the microbenchmark seed-rule duplication, this file's Q6 is the D13
    inferential unit, the highest-severity item in the package. That report's
    items have been renumbered to the non-colliding IR-1..IR-8 scheme and each
    now carries its mapping into this list.
  priority_note: >
    Q6 and Q8 are the two questions that block A1 inference outright, and they
    are the only two that concern the primary statistic rather than a value the
    advisor left blank. Q1-Q5 and Q7 can be answered after A1 without rerunning
    anything. Q6 cannot: it determines which numbers A1 computes. Q8 cannot
    either: it determines which quantity A1 reports as the primary, and the two
    candidate readings have OPPOSITE SIGNS.
  index:
    Q6: "WHICH INFERENTIAL UNIT GOVERNS — 8 blocks / 7 df as ruled, or 400 parameter draws / df ~ 392 as measured? (D13's premise is refuted; ANSWER THIS FIRST)"
    Q8: "HOW DOES THE NORMALIZED CONTRAST AGGREGATE — per-arm ratios differenced, or the raw contrast over ONE common denominator? The two readings have OPPOSITE SIGNS. (ANSWER THIS SECOND)"
    Q1: "In which phase does the D17 624-cell reference check run?"
    Q2: "effective_blocks_min = 4 — the advisor wrote 'too few independent blocks' with no number"
    Q3: "A FOURTH outcome class was added to the advisor's three"
    Q4: "'materially directionally inconsistent' was quantified"
    Q5: "The two D17 columns the advisor named do not gate (AMENDMENT-1)"
    Q7: "D17 gains two further gates and a SECOND TOLERANCE CLASS; a D17 PASS no longer means what it meant (AMENDMENT-4)"

  # ===================================================================
  # Q6 — THE HIGHEST-PRIORITY OPEN QUESTION IN THIS FILE.
  # ===================================================================
  Q6:
    title: "Which inferential unit governs the addendum: 8 parameter-draw blocks with 7 df, as D13 rules, or 400 parameter draws with df ~ 392, as the code and the measurements show?"
    amendment_ref: AMENDMENT-3
    location_of_the_refutation: rulings.D13.premise_refuted_at_A0_1
    severity: BLOCKS_A1_INFERENCE
    status_of_D13: PREMISE_REFUTED_ADVISOR_RULING_REQUIRED
    what_the_advisor_wrote: >
      "D13 — ACCEPT. Use block-clustered inference on the 8 independent
      parameter-draw blocks with 7 degrees of freedom. Use block-resampling
      bootstrap. Never treat the 48 scenarios or 2,400 replicates as independent
      inferential units. State the effective number of blocks and duplicated
      conditions for every reported quantity."
    the_premise_he_was_given: >
      That the DGP parameters are drawn ONCE PER BLOCK and reused across that
      block's 50 replicates, so that there are exactly 8 independent parameter
      draws. That is what the A0 council record, 01A:362-366, 01A:411-417 and the
      runner docstring all told him, and it is what "8 independent
      parameter-draw blocks" names.
    what_was_measured_after_the_ruling: >
      The premise is FALSE. The replicate index is folded into the DGP seed
      (addendum_seed) and draw_params is called INSIDE the replicate loop, so
      parameters are drawn afresh for every replicate. Over 56 within-block
      replicate pairs spanning ALL 8 blocks, max|a(r1) - a(r2)| ranged from
      1.5211429810022610 to 4.5610643088552312 and was EXACTLY 0.0 in 0 of 56
      pairs. The 400 addendum seeds produce 400 DISTINCT (a, b) byte signatures.
      The repository's own frozen test
      `test_replicate_still_varies_the_draw` already asserted this.
    what_the_block_key_really_buys: >
      Excluding delta_eta and n_train makes the 6 scenarios at a fixed
      (block, replicate) share ONE parameter draw — measured max|da| = max|db| =
      EXACTLY 0.0 over 80 comparisons spanning all 8 blocks. That exclusion is
      correct and load-bearing. It establishes the CLUSTER, not the NUMBER of
      draws. D13 inferred the second from the first.
    what_survives_either_way: >
      That sd/sqrt(48), and any per-scenario denominator, understates the
      standard error. The 48 scenario means are clustered. That narrow finding
      is correct and is not in question.
    the_two_options:
      option_A_as_ruled:
        unit: "the block; 8 units; 7 df; block-resampling bootstrap"
        what_it_would_have_to_be_re_justified_as: >
          NOT as a fact about the parameter draws — that is refuted — but as a
          deliberate ESTIMAND CHOICE: that the target of inference generalizes
          to a POPULATION OF CONDITIONS beyond this frozen grid, so between-block
          spread should be charged to the standard error. This is a defensible
          scientific position and it is the advisor's to take. It must be stated
          as an estimand choice.
        cost: >
          SE 10-20x larger than under option B; ~385 df of real information
          discarded; a percentile bootstrap over 8 units admits at most 8^8
          distinguishable resamples and has no usable tail resolution, so
          B = 2000 is false precision; and E1c's per-replicate fiber_count
          restriction cannot be applied coherently to 8 collapsed block means.
      option_B_as_the_evidence_supports:
        unit: "the parameter draw (block, replicate); 400 units per arm; cluster size 6; block a FIXED effect; df ~ 392 per arm"
        rationale: >
          The 8 blocks are a COMPLETE 2 x 2 x 2 enumeration of fixed design
          factors, not a random sample. Between-block spread is designed
          heterogeneity. This is the A0 council's own stated principle
          (S0A_ADDENDUM_COUNCIL_REVIEW.md:229), applied consistently one level up.
        aggregation: "collapse the 6 scenarios within a draw FIRST, keep the 50 draws per block; bootstrap resamples draws WITHIN block, stratified."
        cost: >
          If the intended estimand really is a population of conditions, option B
          understates the uncertainty of THAT estimand.
    the_conservative_choice_is_not_the_safe_choice:
      statement: >
        This must be stated plainly because the usual instinct is wrong here.
        D16's E1 clauses are ONE-SIDED GREATER tests. An inflated standard error
        does not merely widen an interval — it makes a NULL result spuriously
        easy to obtain, and D16.outcome_classifications converts null results
        into REPORTED CONCLUSIONS (NOT SUPPORTED, PARTIALLY SUPPORTED). Choosing
        option A "to be safe" would systematically manufacture false nulls in
        exactly the direction the pre-registered expectations are about.
        Conservatism protects a two-sided claim; it does not protect a one-sided
        one.
    what_changes_if_he_rules_option_A:
      inference: "D13 stands as written; its status returns to ACCEPTED_ADVISOR_RULING with the premise RESTATED as an estimand choice rather than as a fact about the draws."
      required_wording_change: "01A:362-366 and 01A:411-417 remain corrected BY REFERENCE regardless — the factual sentences there are wrong either way."
      also_required: "E1c needs a rule for applying a per-replicate restriction to block means, or an explicit statement that E1c reports descriptively; and the block-resampling bootstrap's 8-unit resolution limit must be disclosed wherever an interval is quoted."
      retractions: "the retractions section still applies in full — the A0 CONFIRMED finding was confirmed on a false premise whichever unit is finally chosen."
    what_changes_if_he_rules_option_B:
      inference: "D13.operative_rule, inference_unit, n_blocks, degrees_of_freedom, aggregation_order and bootstrap.resampled_unit are replaced by rulings.D13.corrected_inferential_unit_proposed."
      d16: "D16.common_statistic.inference follows D13; no D16 clause, no BH member and no outcome classification changes."
      e1c: "E1c's restriction becomes coherent with no change to its own text."
      disclosure: "D13.mandatory_disclosure_per_reported_quantity.required_fields gains effective_n_draws alongside effective_n_blocks; the disclosure rule itself is unchanged."
      no_rerun: "nothing needs re-running. No addendum cell has been executed and no frozen output is affected."
    what_A0_1_did_NOT_do: >
      A0.1 did NOT adopt option B, did not implement it, and did not quietly
      relax D13. D13's ruling text is preserved unedited above. A0.1 flagged the
      premise, recorded the measurement, and returned the decision to the
      advisor.
    operative_until_he_rules: >
      NEITHER SCHEME IS OPERATIVE. This is the one place in this file where no
      frozen default is carried forward, because the ruled default is known to
      rest on a false premise and adopting the alternative unilaterally would be
      overriding a binding ruling. A1 inference is BLOCKED on this question. The
      A1 runner may still be built, tested and gated; it may not compute a
      standard error, a p-value or a q-value until Q6 is answered.

  Q1:
    title: "In which phase does the D17 624-cell reference check run?"
    neutral_statement_of_the_tension: >
      D17 requires persisting BOTH production and reference gaps and their
      identity errors for at least 624 addendum cells. Production values for
      ADDENDUM cells cannot exist until Phase A1 runs, because A0.1 is forbidden
      to run any addendum cell. The advisor's A0.1 console block nevertheless
      lists `D17 INDEPENDENT REFERENCE CHECK: <passed/required>` as an A0.1 line
      item. The two are not jointly satisfiable as literally written.
    adopted_reading_at_A0_1:
      what_A0_1_does: >
        A0.1 BUILDS and VALIDATES the reference-check harness against the
        EXISTING FROZEN d = 3 arm, where production values already exist, and
        reports `passed/required` over that existing-arm sample. This exercises
        `sim1_core.reference_gap_report`, the six persisted columns, the
        production-versus-reference comparison and the tolerance, without
        executing a single addendum cell.
      what_moves_to_A1: >
        The >= 624 ADDENDUM-cell reference check becomes an A1 gate, folded into
        the D18 criterion (new_acceptance_criteria.AD15) and evaluated before any
        addendum cell is retained.
    status_of_this_reading: ADOPTED_BUT_CONFIRMABLE
    explicitly_not: "a settled decision, and not a narrowing of D17"
    if_the_advisor_overrules: >
      The alternative readings are (a) the A0.1 console line refers only to the
      harness, which is what is adopted; or (b) D17's 624-cell check is deferred
      in full and the A0.1 console line is reported as 0/624 required. Either can
      be adopted without changing any other entry in this file; only the A0.1
      console value and the placement of the check inside AD15 would change.
  Q2:
    title: "effective_blocks_min = 4 for the E1c low-power fallback"
    location_of_the_frozen_value: rulings.D16.clauses.E1c.low_power_fallback.frozen_threshold_effective_blocks_min
    what_the_advisor_wrote: >
      Verbatim, under D16 E1c: "if too few independent blocks remain, report
      descriptively without a significance claim." He set the RULE but named NO
      NUMBER for "too few".
    what_was_frozen_and_why:
      value: 4
      justification_as_recorded: >
        With 3 or fewer surviving block means the cluster-robust t interval has
        <= 2 df and is not usable, so 4 is the smallest count at which a
        significance claim is defensible.
      why_frozen_before_A1: >
        So the threshold cannot be chosen after seeing the outcome. Freezing SOME
        number before the run is not optional; which number it is, is his call.
    the_alternative: >
      Any other integer threshold. 5 or 6 is the natural stricter choice (4 or 5
      df); 3 is the natural looser one, at the cost of a 2-df interval.
    what_changes_if_he_rules_the_other_way:
      if_stricter: "E1c is more likely to fall back to descriptive reporting; the BH family then has 2 members instead of 3, which LOWERS the q-values of E1a and E1b. This is not a neutral change to the other two clauses."
      if_looser: "E1c keeps a significance claim on as few as 2-3 df, i.e. an interval wide enough to be near-uninformative but still quotable."
      nothing_else: "no other entry in this file changes; the value appears in exactly one place."
    operative_until_he_rules: 4

  Q3:
    title: "A FOURTH outcome class, INCONCLUSIVE_REPORTED_IN_FULL, was added to the advisor's three"
    location_of_the_frozen_value: rulings.D16.outcome_classifications.residual_case
    what_the_advisor_wrote: >
      He specified EXACTLY THREE classes and their conditions: CONFIRMED
      (positive primary normalized log-loss contrast, one-sided BH q < 0.05,
      Brier contrast same direction); PARTIALLY SUPPORTED (primary positive but
      q >= 0.05 WHILE raw log-loss and normalized Brier contrasts have the same
      positive direction); NOT SUPPORTED (primary non-positive, or the principal
      risk measures materially directionally inconsistent).
    the_gap_that_was_found: >
      A clause can satisfy none of the three. Concretely: primary normalized
      log-loss estimate POSITIVE, q >= 0.05, but the raw log-loss contrast OR the
      normalized Brier contrast is NON-POSITIVE while not being materially
      directionally inconsistent. That case fails CONFIRMED (q), fails PARTIALLY
      SUPPORTED (his "while" clause), and fails NOT_SUPPORTED (the primary is
      positive and the inconsistency is below the materiality threshold).
    what_was_frozen_and_why:
      value: "a fourth class INCONCLUSIVE_REPORTED_IN_FULL, printing all four component estimates, explicitly never rounded up to PARTIALLY SUPPORTED"
      justification_as_recorded: >
        The alternative to naming the case is silently absorbing it into one of
        the three, which would be a reporting decision made by omission.
    why_this_is_promoted_rather_than_left_frozen: >
      ADDING A CLASS TO HIS FROZEN DECISION RULES IS A MATERIAL CHANGE TO THE
      RULES, not a clarification of them. He may consider a three-way partition
      deliberate.
    the_alternatives:
      a: "keep the fourth class as frozen (operative default)"
      b: "widen NOT_SUPPORTED to be the residual — anything not CONFIRMED and not PARTIALLY SUPPORTED is NOT SUPPORTED"
      c: "widen PARTIALLY SUPPORTED by relaxing his 'while' clause to require only ONE of the raw log-loss / normalized Brier contrasts to be positive"
    what_changes_if_he_rules_the_other_way:
      if_b: "a positive-but-unconvincing clause is reported as NOT SUPPORTED, which overstates the negative. Only the label changes; the four component estimates are printed either way."
      if_c: "the same clause is reported as PARTIALLY SUPPORTED, which overstates the positive. This is the direction the frozen text explicitly refuses ('never rounded up')."
      nothing_else: "no estimate, no test, no q-value and no acceptance criterion depends on the class label — these are outcome summaries, not validity gates (his own words)."
    operative_until_he_rules: "the fourth class, INCONCLUSIVE_REPORTED_IN_FULL"

  Q4:
    title: "'Materially directionally inconsistent' was quantified"
    location_of_the_frozen_value: rulings.D16.outcome_classifications.NOT_SUPPORTED.materially_directionally_inconsistent_definition
    what_the_advisor_wrote: >
      "NOT SUPPORTED means the primary normalized estimate is non-positive or the
      principal risk measures are materially directionally inconsistent." He used
      the word "materially" without defining it.
    what_was_frozen_and_why:
      value: >
        The normalized log-loss contrast and the normalized Brier contrast have
        OPPOSITE SIGNS **AND** both absolute estimates exceed 1.0e-6.
      justification_as_recorded: >
        Opposite signs where either magnitude is at or below 1.0e-6 are numerical
        noise, not material inconsistency. The threshold reuses the inherited
        tolerances.positive_gap_min = 1.0e-6 (01_PROTOCOL_FREEZE.yaml:527) rather
        than introducing a new constant into the freeze.
    the_alternatives:
      a: "keep the frozen definition (operative default)"
      b: "a larger materiality threshold, e.g. a fraction of the estimate's own block-clustered SE, which would make 'material' scale with the noise rather than with an absolute constant"
      c: "require the inconsistency to be statistically distinguishable from zero on both scales rather than merely to exceed a magnitude"
    what_changes_if_he_rules_the_other_way:
      if_b_or_c: "some clauses that the frozen rule labels NOT SUPPORTED would instead fall into the residual class of Q3. The two questions interact: the answer to Q4 changes WHICH cases land in Q3's fourth class."
      nothing_else: "the definition appears in exactly one place and gates no acceptance criterion."
    operative_until_he_rules: "opposite signs AND both |estimates| > 1.0e-6"

  Q5:
    title: "The two D17 columns the advisor named do not gate — his ruling as written does not do what he intended"
    location_of_the_correction: rulings.D17.corrects_the_advisor_ruling_as_written
    amendment_ref: AMENDMENT-1
    what_the_advisor_wrote: >
      "D17 — ACCEPT. Evaluate AD1 and AD2 using the independent
      sim1_core.reference_gap_report implementation. ... Persist production and
      reference log-loss/Brier gaps and their identity errors."
    his_evident_intent: >
      To escape a self-referential check. The A0 council found that
      exact_gap_report computes the risk difference and the theoretical gap from
      the SAME fiber_posteriors aggregation, so an identity error recomputed from
      stored columns is ~1e-16 BY CONSTRUCTION and AD1/AD2 would pass whatever
      the fiber algebra does.
    what_was_measured_after_the_ruling: >
      Three defects injected in-process into the D17 harness. Two of them made
      the production result wrong by 5.5e-07 and 1.1e-02, and BOTH identity-error
      columns he named stayed UNCHANGED at 5.4e-15. A third defect (fiber
      merging) moved neither the identity errors nor the production-versus-
      reference difference; only a recomputed-versus-stored fiber_count caught
      it (0/624 match). Full table: rulings.D17.measured_sensitivity_at_A0_1.
    root_cause_in_one_sentence: >
      reference_gap_report defines ebar_f as its own mass-weighted within-fiber
      mean, so its internal identity telescopes exactly and is a self-check of
      the same class as the production one; and both paths consume the same fid,
      so fiber-construction defects evade the cross-implementation comparison
      too — the exact failure class the docstring at sim1_core.py:332-346 warns
      about.
    what_was_frozen_and_why:
      value: >
        The two named columns are RETAINED as mandatory persisted columns but
        RECLASSIFIED as DESCRIPTIVE_NOT_GATING. AD1/AD2 gate conjunctively on
        (G1) |production - reference| on both risk scales at exact_identity_abs,
        and (G2) recomputed_fiber_count == stored_fiber_count.
      justification: >
        G1 and G2 together detect all three injected defects and each is
        necessary; the columns he named detect none of them. His sampling rule,
        his choice of reference implementation and his tolerance are unchanged.
    the_alternative: >
      Gate on the identity-error columns as literally written. The measured
      evidence shows that gate cannot fail.
    what_changes_if_he_rules_the_other_way: >
      AD1/AD2 become a check that passes unconditionally; that must then be
      stated plainly in the acceptance report rather than reported as a passed
      verification. The persisted columns are identical either way, so the
      decision can be revisited after A1 without rerunning anything.
    operative_until_he_rules: "G1 AND G2, with the named identity errors persisted but descriptive"
    also_for_his_attention: >
      The on-disk 05b `representation_loss` column is a MONTE-CARLO PLUG-IN over
      the 50,000-row evaluation sample, differing from the exact population gap
      by up to 1.07e-3. D17's "must also satisfy exact_identity_abs" (1.0e-10) is
      therefore NOT SATISFIABLE against that stored column, and would fail for a
      CORRECT implementation. It is implemented against the exact fast path
      instead. See rulings.D17.representation_loss_is_monte_carlo.

  Q7:
    title: "D17 gains two further gates and a second tolerance class: a D17 PASS no longer certifies what it certified when the ruling was written"
    location_of_the_correction: rulings.D17.evaluation_rule.ad1_ad2_gating_rule
    amendment_ref: AMENDMENT-4
    this_is_the_third_correction_to_D17: >
      Stated plainly because the pattern is itself evidence. D17 as the advisor
      wrote it did not gate (Q5). D17 as AMENDMENT-1 amended it gates against
      three defect classes but not against a fourth. Each correction was forced
      by a measurement taken after the previous one, not by a change of mind.
    what_the_advisor_wrote: >
      "D17 — ACCEPT. Evaluate AD1 and AD2 using the independent
      sim1_core.reference_gap_report implementation. ... Persist production and
      reference log-loss/Brier gaps and their identity errors." His ruling names
      ONE tolerance for the comparison it requires: the inherited
      exact_identity_abs.
    what_was_measured_after_AMENDMENT_1: >
      A Phase A0.1 review council attacked the amended two-gate rule from two
      independent seats. council-Claude executed a fiber-assignment permutation
      in the runner: 1,027 tests passed, relative_log_gap on hash_column/B0
      moved 0.1564 -> 0.4715 (3.01x), and both surviving gates read clean.
      Codex derived the same class independently (C4, a wrong same-cardinality
      partition). Reproduced on the frozen d = 3 arm through the D17 harness
      itself: fiber_permute leaves |production - reference| at 5.4e-15 and
      fiber_count at 624/624 while corrupting the population gap.
    what_was_frozen_and_why:
      value: >
        TWO further co-equal gates. G3: the stored representation loss must
        agree with the recomputed exact population gap to within
        6 * stored_mcse + 1e-9, per metric. G4: the stored canonical partition
        fingerprint must equal the recomputed one, exactly.
      justification: >
        G3 is the only comparison in D17 that crosses the fiber-construction
        boundary, because the stored value is the runner's Monte-Carlo risk
        under the partition the runner ACTUALLY used. G4 is required in
        addition because G3's tolerance is the Monte-Carlo noise floor: the
        minimal same-cardinality defect moved the gap in 151 cells and G3 saw 6
        of them, none of them a hash configuration — and at d = 5 the six hash
        configurations are the ONLY ones with a non-trivial partition.
    what_this_changes_about_a_D17_PASS: >
      A PASS now asserts four things rather than two, and one of them is
      asserted at a tolerance the advisor never set. A run that would have been
      reported as a clean D17 PASS under AMENDMENT-1 can now FAIL, and the
      failure would be reported, not retuned (provenance.immutability).
    the_new_tolerance_class_he_has_not_seen:
      what: "6 * stored_mcse + 1.0e-9, applied to G3 only"
      why_it_is_not_covered_by_his_ruling: >
        `tolerance_ref` in this file is exact_identity_abs = 1.0e-10, inherited
        from 01_PROTOCOL_FREEZE.yaml:525. It is an EXACT tolerance and G3 does
        not compare two exact numbers: the stored column is a Monte-Carlo
        plug-in that differs from the exact gap by up to 1.07e-3 on a CORRECT
        implementation, so gating it at 1.0e-10 would fail a correct run. No
        constant absolute tolerance works either, because the sample's mcse
        spans 0 to 6.8e-4. A tolerance scaled by the stored quantity's own
        standard error is the only one that adapts.
      how_k_was_chosen: >
        k = 6 is the constant already used by the runner-level AD1/AD2 property
        test. On the 624 clean cells the worst uses 0.592 of its budget
        (3.55 mcse); at k = 3 two clean cells would fail. It was fixed before
        the attacks were run and was not widened to fit anything.
      the_floor: "1.0e-9, because 202 of 624 clean cells have mcse exactly 0 (the injective encoders satisfy ebar == eta pointwise); their observed differences are at most 2.2e-16"
    what_G4_costs: >
      One new persisted column on the A1 runner, `fiber_fingerprint` (32 hex
      characters per SUCCESS row), and a new pure function
      sim1_core.partition_fingerprint. No existing column, row count or number
      changes. The frozen d = 3 twin predates the column, so G4 reports
      NOT_EVALUATED there and is live only on the A1 arm.
    the_alternatives:
      a: "ratify both gates as frozen (operative default)"
      b: "ratify G3 and decline G4, accepting that the minimal same-cardinality defect is detected in ~1% of cells and that at d = 5 the exposure is concentrated in the six hash configurations"
      c: "decline both and keep the AMENDMENT-1 two-gate rule, in which case the acceptance report must state that a defect corrupting the D16 primary statistic by 3x passes D17 with every column reading clean"
    what_changes_if_he_rules_the_other_way: >
      Nothing needs re-running either way: the gates are evaluated after the A1
      arm from persisted columns, and every column is persisted under all three
      alternatives. Only the verdict changes.
    operative_until_he_rules: "G1 AND G2 AND G3 AND G4, conjunctively"

  # ===================================================================
  # Q8 — THE SECOND QUESTION THAT BLOCKS A1 INFERENCE.
  # ===================================================================
  Q8:
    title: "How does the normalized contrast aggregate: the DIFFERENCE OF THE TWO ARMS' PER-ARM RATIOS, or the RAW CONTRAST OVER ONE COMMON DENOMINATOR? The two readings have opposite signs."
    amendment_ref: AMENDMENT-5
    severity: BLOCKS_A1_INFERENCE
    provenance_document: S0B_NORMALIZED_CONTRAST_SENSITIVITY.md
    verification_ref: a0_1_verification.V13
    what_the_advisor_wrote: >
      D14: "Report both: 1. raw absolute risk gaps; and 2. signal-normalized
      gaps", followed by two formulas that are stated PER ARM —
      relative_log_gap = (R_log*(Z) - R_log*(X)) / (H(Y) - R_log*(X)) and
      relative_brier_gap = (R_Brier*(Z) - R_Brier*(X)) / Var{eta(X)}.
      D16 E1a then makes the primary statistic "the block-clustered d=5 minus
      d=3 relative (signal-normalized) log-loss gap, i.e. the contrast in
      relative_log_gap as defined in D14.estimands.normalized". Neither text
      says HOW the contrast of a RATIO is formed.
    what_is_left_undetermined:
      a_the_decisive_one: >
        Is the normalized contrast the DIFFERENCE OF TWO PER-ARM RATIOS (two
        different denominators, which is what D14's per-arm formula literally
        gives), or the RAW CONTRAST DIVIDED BY ONE COMMON DENOMINATOR (the d=3
        arm's, or the two arms' mean)? D14's formula excludes the second reading;
        D16's wording never forbids it; and it is the reading under which the
        headline FLIPS SIGN.
      b: >
        At which level does the division happen when replicates are averaged?
        01A contrast.aggregation ("replicates are averaged WITHIN scenario
        first") is unambiguous for a LINEAR quantity; relative_log_gap is a
        RATIO, and "average the replicates first" does not say whether the
        average is of the ratio, or inside it.
      c: >
        Is the primary pooled over the three delta_eta levels, or reported per
        level? D14 mandates per-stratum reporting for interaction_pairs and is
        SILENT on delta_eta.
    measured_at_A0_1:
      how: >
        Exact 1024-state population layer, 50 replicates per block per arm, 8
        blocks; t throughout uses D13's unit as ruled (8 block means, 7 df) so
        the rows isolate the AGGREGATION choice. No learner is fitted and ZERO
        addendum cells were executed. Command:
        `PYTHONPATH=src /Users/Eric/.pyenv/versions/3.11.9/bin/python3
        scripts/s0b_normalized_contrast_sensitivity.py --reps 50` (about 5 s).
      not_identified_handling: "min denominator observed 2.713e-03 (log) and 1.354e-03 (Brier) against D14's tolerance 1.0e-06 — NO cell is NOT_IDENTIFIED, so no row below is affected by that rule."
      E1a_hash_shared:
        - "reading (a) PER-ARM, A1 mean-of-ratios:            -0.01815  SE 0.01007  t -1.80  blocks>0 1/8"
        - "reading (a) PER-ARM, A2 ratio-of-means in scenario: -0.01964  SE 0.01023  t -1.92  blocks>0 1/8"
        - "reading (a) PER-ARM, A3 ratio-of-means in block:    -0.01790  SE 0.01115  t -1.61  blocks>0 1/8"
        - "reading (a) PER-ARM, A6 d=3 numerator from the frozen twin: -0.01822  SE 0.01000  t -1.82  blocks>0 1/8"
        - "reading (a) COMMON DENOMINATOR, A4 over the d=3 denominator: +0.34759  SE 0.06242  t +5.57  blocks>0 8/8"
        - "reading (a) COMMON DENOMINATOR, A5 over the two-arm mean:    +0.19357  SE 0.03222  t +6.01  blocks>0 8/8"
        - "level (c), A1 at delta_eta 0.0 / 0.1 / 0.3: -0.02353 (t -3.37) / -0.02023 (t -1.74) / -0.01069 (t -0.78)"
        - "RAW log-loss contrast (linear, ratio-order-free): +0.00919  SE 0.00198  t +4.64  blocks>0 8/8"
        - "normalized Brier companion (A1): -0.01967  SE 0.01037  t -1.90  blocks>0 1/8"
      E1b_hash_column_mean_B0_B1:
        - "reading (a) PER-ARM, A1 mean-of-ratios: -0.05182  SE 0.01961  t -2.64  blocks>0 2/8"
        - "reading (a) COMMON DENOMINATOR, A4 over the d=3 denominator: +0.11646  SE 0.04592  t +2.54  blocks>0 7/8"
        - "reading (a) COMMON DENOMINATOR, A5 over the two-arm mean:    +0.04619  SE 0.02936  t +1.57  blocks>0 6/8"
        - "RAW log-loss contrast: +0.00129  SE 0.00209  t +0.62  blocks>0 6/8"
      what_does_NOT_matter: >
        Three folding rules that were suspected of being ambiguous are
        IMMATERIAL to the estimate, and this narrows the question to (a)-(c)
        above. E1a's B0/B1/B2 collapse: max|rel_log(B0) - rel_log(B1 or B2)| =
        4.25e-14 over all 2,400 cells, so the three widths induce one partition.
        E1b's "average B0 and B1": the denominator does not depend on the
        encoder, so mean-of-normalized IS normalized-of-mean, exactly.
        Recomputing the d=3 arm exactly versus reading it from the frozen twin:
        -0.01822 vs -0.01815 (E1a), -0.05185 vs -0.05182 (E1b).
    the_finding_this_decides:
      claim_at_stake: "the normalized contrast has the OPPOSITE SIGN to the raw contrast."
      survives: >
        ALL ELEVEN per-arm aggregations measured for E1a — A1, A2, A3, A6, the
        three delta_eta levels, both interaction_pairs strata, every width
        folding, and the normalized Brier companion — are NEGATIVE, spanning
        -0.0179 to -0.0196, with 1 of 8 blocks positive, against a raw contrast
        that is positive in 8 of 8 blocks. The reversal does NOT depend on how
        replicates, delta_eta levels or bucket widths are folded.
      reverses: >
        Under BOTH common-denominator readings the normalized contrast is
        POSITIVE and there is NO REVERSAL AT ALL: A4 +0.34759 (t +5.57, 8/8) and
        A5 +0.19357 (t +6.01, 8/8) for E1a. The reversal is proof against every
        choice INSIDE D14's per-arm formula and disappears under a reading D14's
        formula excludes but D16's wording never explicitly forbids.
      caveat_the_claim_rests_on_E1a_alone: >
        E1b's RAW contrast is only +0.00129 with t = +0.62 (6 of 8 blocks), so
        E1b is "raw approximately zero, normalized negative" rather than a
        reversal. The reversal claim rests on E1a, where the raw contrast is
        unambiguous at +0.00919, t = +4.64, 8 of 8 blocks.
    the_alternatives:
      a1_per_arm: "the difference of the two arms' relative_log_gap values, as D14's formula literally reads. OPERATIVE DEFAULT."
      a2_common_denominator: "the raw contrast over one denominator — the d=3 arm's, or the two arms' mean. D16 does not exclude it in words."
      c1_pooled: "one primary pooled over the three delta_eta levels. OPERATIVE DEFAULT."
      c2_per_level: "a primary per delta_eta level, as D14 already requires for interaction_pairs."
    what_changes_either_way:
      if_per_arm_a1: >
        E1a's primary is negative and not significant at the ruled unit
        (-0.0182, t = -1.80, q >= 0.05). Under D16's outcome_classifications
        that is NOT SUPPORTED (the primary normalized estimate is non-positive),
        and the raw/normalized sign reversal becomes the addendum's headline
        finding and must be reported as such.
      if_common_denominator_a2: >
        E1a's primary is positive and significant (+0.348, t = +5.57, 8/8
        blocks), which is CONFIRMED provided the Brier contrast agrees in
        direction. The sign reversal disappears entirely and the addendum's
        headline is the opposite one. Nothing needs re-running: both readings
        are computed from the same persisted columns.
      if_per_level_c2: >
        The estimate moves by a factor of about 2 and is MONOTONE in delta_eta
        (E1a -0.0235 at 0.0 to -0.0107 at 0.3; E1b -0.0793 to -0.0214). Which
        level is primary would then have to be named. Level (b) moves the
        estimate by less than 0.002 and can be settled by fiat.
      nothing_needs_rerunning: >
        Every reading is a function of the same persisted per-arm risks, so Q8
        can in principle be answered after A1 — but the primary statistic, the
        BH adjustment set and the E1 outcome classification all depend on it,
        so answering it afterwards means choosing the headline after seeing it.
        That is why it is raised before A1 rather than after.
    the_unreproduced_acceptance_check_figure:
      figure: "mean -0.0028, t = -0.58, 3 of 8 blocks positive"
      source: "the A0.1 acceptance check's own independent reproduction of the E1a normalized contrast"
      status: NOT_REPRODUCED_BY_ANY_ENUMERATED_ROUTE
      what_was_tried: >
        None of the eleven per-arm aggregations, neither common-denominator
        reading, no delta_eta restriction, no width folding and no inference unit
        lands near it. Three further readings outside D14's formula were also
        tested and are also not it: hashing the d=3 arm on its active 3-column
        space (+0.12228, t +9.15, 8/8), using H(Y) alone as the denominator
        (+0.01324, t +4.64, 8/8), and normalizing the contrast by the d=5
        denominator (+0.12805, t +4.88, 7/8). Two structural coincidences, offered
        so the check can locate its own route rather than as an explanation:
        t = -0.58 is exactly the E1b interaction_pairs = 0 per-stratum statistic
        (estimate -0.01247, 2 of FOUR blocks positive, a 4-block cut); and
        "3 of 8 blocks positive" occurs at A1 restricted to delta_eta = 0.3
        (-0.01069, t -0.78) and at E1b A3 (-0.04493, t -2.03).
      rule: >
        The check's estimate AGREES with the measurement above in sign and in
        significance verdict and DISAGREES in magnitude by a factor of about 6.
        Until the check publishes its aggregation, -0.0028 MUST NOT be quoted
        beside -0.0182 as though the two were competing measurements of one
        estimand. Neither figure is withdrawn; the route is what is missing.
    related: "D16's inference line still inherits D13's refuted premise — Q6. Q6 fixes the inference UNIT; Q8 fixes the QUANTITY. They are independent and both must be answered."
    what_is_required: "One sentence fixing (a), and a statement on (c), before A1 is authorised."
    operative_until_he_rules: >
      Reading (a)-PER-ARM (the difference of the two arms' relative_log_gap
      values), pooled over delta_eta, with the per-stratum interaction_pairs
