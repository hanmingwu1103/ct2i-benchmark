  DQ1:
    title: "Does 'NULL metrics on a non-SUCCESS row' apply to METRIC_UNDEFINED, which currently KEEPS its metrics?"
    the_conflict:
      inherited_rule: >
        01A (carried into new_acceptance_criteria.AD15 item 8, and into the
        advisor's own D18 bullet "require NULL metrics on non-success rows")
        states that a non-SUCCESS cell carries NULL metrics.
      what_the_existing_runner_does: >
        scripts/run_sim1b_finite.py:235 sets status = METRIC_UNDEFINED on a row
        that has ALREADY been populated with a valid log-loss, risk decomposition
        and representation loss. The status is stamped because the EVALUATION
        SAMPLE turned out to be single-class, which makes ROC-AUC and PR-AUC
        undefined — not the log-loss.
      the_tension: >
        The strict reading NULLs the whole row, discarding a log-loss that is
        perfectly well defined. The permissive reading keeps the metrics and
        treats METRIC_UNDEFINED as a per-column annotation about the AUC columns
        only, which weakens the "no failure is stored as a valid number" guard.
    what_the_new_runner_does: "the STRICT reading — a METRIC_UNDEFINED row carries NULL metrics"
    reachability_in_the_frozen_addendum_design:
      question_as_posed: "is the single-class evaluation sample reachable at all, in the frozen design?"
      finding: NOT_REACHABLE_IN_PRACTICE
      argument:
        - "the evaluation sample is n_eval = 50,000 i.i.d. draws (01A design.n_eval = 50000; sim1_design.N_EVAL = 50_000; run_sim1b_finite.py:131 n_test = D.N_EVAL, drawn at run_sim1b_finite.py:142)"
        - "single-class means all 50,000 labels equal — the event tested at run_sim1b_finite.py:207, len(np.unique(yev)) > 1"
        - "01A exactness.consequences_verified_at_A0 records, as a VERIFIED property of the frozen addendum design: 'eta stays inside [0.05, 0.95] at all 1024 states, so clipping never occurs'"
        - "with eta bounded in [0.05, 0.95] at every state, P(all 50,000 labels identical) <= 2 x 0.95^50000"
      numeric_bound: "<= 10^-1113.5 (log10(2) + 50000*log10(0.95) = -1113.52)"
      provenance_one_liner: "/Users/Eric/.pyenv/versions/3.11.9/bin/python3 -c \"from math import log10; print(log10(2)+50000*log10(1-0.05))\""
      addendum_cells_executed_by_this_check: 0
      conclusion: >
        In the FROZEN addendum design the branch is unreachable, so the strict
        reading discards nothing in practice and the two readings cannot
        disagree on any retained row. The question is therefore about the RULE,
        not about any row that will exist.
      scope_caveat: >
        This bound depends on the [0.05, 0.95] eta guarantee, which is a property
        of the frozen addendum design at M = 5, K = 4, d_active = 5 and
        tau in {0.5, 1.5}. It does NOT transfer to any future configuration with
        a wider eta range or a smaller n_eval, and the strict reading should not
        be relaxed on the strength of an unreachability that a design change
        could remove.
    what_the_advisor_is_asked: >
      Whether METRIC_UNDEFINED is (a) a non-SUCCESS status subject to the NULL
      rule — the strict reading, currently implemented — or (b) a per-column
      annotation that leaves valid metrics in place. The unreachability above
      means either answer costs nothing on the addendum arm.
    binding_status: "the strict reading is operative; no A1 output depends on the difference"

