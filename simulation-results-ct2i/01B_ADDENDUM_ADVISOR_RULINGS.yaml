            at 55.1%.
          erratum_sites_not_edited: >
            S0B_COUNCIL_REVIEW.md is a FROZEN VERBATIM RECORD of what four seats
            said and is NOT edited. Its S-M1 row and its section 5 record the 82%
            figure as "not reproduced". That reading is corrected by ERRATUM E-1
            in S0B_FINAL_GATE_REPORT.md section 6.3, which names those sites.
            What the seat said stands as said.
      c3_conservatism_is_not_safe_here:
        statement: >
          D13's SE is conservative in MAGNITUDE, and conservatism is NOT the safe
          choice under these decision rules, because D16's E1 clauses are
          ONE-SIDED GREATER tests (D16.common_statistic.directionality, inherited
          from 01A expectations.E1.directionality). An inflated SE makes a NULL
          outcome spuriously easy to obtain, and
          D16.outcome_classifications turns null outcomes into REPORTED
          CONCLUSIONS (NOT SUPPORTED / PARTIALLY SUPPORTED). Under D13 as
          written, the addendum would manufacture false nulls in exactly the
          direction the pre-registered expectations are about.
        rule: >
          "Conservative" must not be used in this file, in the A1 reports or in
          the manuscript as a justification for D13's unit without this sentence
          attached.
      c4_E1c_incoherence:
        statement: >
          D16 E1c restricts the primary analysis to matched conditions in which
          both mappings are non-injective (fiber_count < 1024). D16 itself records
          that this is "a random sampling-tie event depending on replicate and on
          n_train" (E1c.non_emptiness_verified.full_context). The restriction is
          therefore defined PER (block, replicate, scenario). Under D13's collapse
          to 8 block means the restriction CANNOT be applied coherently: a block
          mean mixes cells that satisfy and cells that fail the restriction, and
          E1c's low_power_fallback (frozen_threshold_effective_blocks_min = 4)
          can fire for a purely artefactual reason — because there are only 8
          units to begin with, not because the stratum is thin.
        consequence: "correcting D13 to the draw level also repairs E1c. E1c's own rule text is NOT changed by this amendment."
    aggregation_order: >
      1. average replicates WITHIN a scenario;
      2. form the matched d=5 minus d=3 difference per scenario pair;
      3. average scenario-pair differences WITHIN a block, giving 8 block means;
      4. compute the point estimate, the cluster-robust SE and the t interval on
         those 8 block means with 7 df.
    bootstrap:
      kind: block_resampling_paired_percentile
      resampled_unit: block
      B: 2000
      seed: 90210
      note: "B and seed inherited from 01A contrast.uncertainty.bootstrap; unchanged."
    prohibited_procedures:
      - id: P13a
        prohibited: "sd/sqrt(48) or any per-scenario denominator, for any quantity, anywhere"
        reason: "anti-conservative; the 48 scenarios span only 8 parameter draws"
      - id: P13b
        prohibited: "treating the 48 scenarios as independent inferential units"
      - id: P13c
        prohibited: "treating the 2,400 replicates (48 scenarios x 50) as independent inferential units"
      - id: P13d
        prohibited: "any i.i.d. bootstrap over scenario pairs or over replicates"
      - id: P13e
        prohibited: "labelling the spread across the fixed factor grid as MCSE; it is condition_spread (01A contrast.uncertainty.mcse_naming_caveat)"
    mandatory_disclosure_per_reported_quantity:
      rule: >
        EVERY reported quantity — in the acceptance report, the validation
        report, every table and every figure caption — must state (i) its
        effective number of blocks and (ii) its duplicated conditions. Neither
        may be assumed, inferred by the reader, or omitted because it equals the
        nominal value.
      required_fields:
        - effective_n_blocks          # integer, after removing duplicated/degenerate conditions
        - effective_n_scenario_pairs  # integer, after removing duplicated conditions
        - duplicated_conditions       # explicit description, or the string "none"
        - degrees_of_freedom          # effective_n_blocks - 1
      known_duplications_inherited_from_01A:
        - what: "representation loss is EXACTLY invariant to n_train for the deterministic encoders (label, onehot, hash_shared, homals); measured max|rep_loss(n=500) - rep_loss(n=5000)| == 0.0 on the frozen twin"
          consequence: "24 of the 48 scenario pairs are literal duplicates; effective_n_scenario_pairs = 24 for those encoders BEFORE clustering"
          source: "01A contrast.uncertainty.duplicate_pairs_disclosure"
        - what: "hash_shared representation loss is IDENTICAL across bucket widths B0/B1/B2; measured max|B0-B1| == max|B0-B2| == 0.0 on the frozen twin"
          consequence: "the three hash_shared width contrasts are ONE piece of evidence, not three; see D16 E1a"
          source: "01A contrast.uncertainty.degenerate_bucket_widths_disclosure"
      failure_mode_if_omitted: >
        A quantity reported without its effective block count and its duplicated
        conditions is non-conforming and must not be quoted in the manuscript.

  D14:
    title: "Signal-strength confound — OPTION 1 accepted with a narrowed interpretation"
    status: ACCEPTED_ADVISOR_RULING
    replaces_in_01A:
      - "decisions.D14.status UNRESOLVED_ADVISOR_RULING_REQUIRED -> RESOLVED: option_1"
      - "disclosed_confound_signal_strength.advisor_options_at_the_A0_gate — option_2 and option_3 are now CLOSED and may not be revisited"
    adopted_option: 1
    operative_rule: >
      Keep the inherited d=5 DGP UNCHANGED. Do NOT divide tau by sqrt(d). Do NOT
      add a third signal-matched arm. Report BOTH raw absolute risk gaps AND
      signal-normalized gaps. Frame the arm as a DENSE-SIGNAL STRESS TEST.
    explicitly_closed_options:
      option_2_normalise_tau_by_sqrt_d: CLOSED_FORBIDDEN
      option_3_signal_matched_third_arm: CLOSED_FORBIDDEN
    dgp_status: "01A design block unchanged; d_active = 5, tau in {0.5, 1.5} exactly as frozen"

    framing_token:
      frozen_token: DENSE_SIGNAL_STRESS_TEST
      usage: >
        This token, or its plain-language expansion "dense-signal stress test",
        is the ONLY permitted framing of the addendum arm in the acceptance
        report, the validation report, figure captions, table notes and the
        manuscript.
      forbidden_labels:
        - "pure dimensionality effect"
        - "pure dimensionality experiment"
        - "pure dimensionality"
      conditionally_forbidden_labels:
        - label: "dimensionality effect"
          forbidden_unless: "the same sentence, caption or table note carries BOTH the signal-normalized companion quantity AND the C1/C2/C3 confound disclosure"
      forbidden_label_scope: "every A1 output, every figure caption, every table note, and the manuscript"
      enforcement: >
        A string check for the forbidden phrases over all A1 text outputs is part
        of the D18 gate (see new_acceptance_criteria.AD15 item 11).

    estimands:
      raw:
        log: "R_log*(Z) - R_log*(X)"
        brier: "R_Brier*(Z) - R_Brier*(X)"
        status: PRIMARY_ALWAYS_REPORTED
      normalized:
        relative_log_gap:
          formula: "(R_log*(Z) - R_log*(X)) / (H(Y) - R_log*(X))"
          numerator: "R_log*(Z) - R_log*(X)"
          denominator: "H(Y) - R_log*(X)"
          denominator_meaning: "the total log-loss signal available in X, in nats: the binary entropy of the marginal P(Y=1) minus the Bayes log-loss risk given X"
          units: dimensionless
        relative_brier_gap:
          formula: "(R_Brier*(Z) - R_Brier*(X)) / Var{eta(X)}"
          numerator: "R_Brier*(Z) - R_Brier*(X)"
          denominator: "Var{eta(X)}"
          denominator_meaning: "the variance of the conditional probability eta(X) = P(Y=1|X) under the exact cell law"
          units: dimensionless
        status: PRIMARY_FOR_D16_DECISION_RULES_AND_SENSITIVITY_ELSEWHERE

    eta_is_a_probability_not_a_linear_predictor:
      why_this_block_exists: >
        A future implementer reading "Var{eta(X)}" may assume eta is the linear
        predictor and "correct" the Brier normaliser to Var(g). That correction
        would be WRONG in this codebase. This block records the verified fact so
        the mistake cannot be made silently.
      verified_fact: >
        In this codebase `sim1_core.eta_raw` returns 1/(1+exp(-tau*g)), i.e. eta
        IS the conditional probability P(Y=1|X), NOT a linear predictor.
      evidence:
        - "src/ct2i_benchmark/simulations/sim1_core.py:156-162 — def eta_raw(...); docstring 'logistic(g(x)) on the active block; beta0 = 0'; final statement `return 1.0 / (1.0 + np.exp(-prm.tau * g))`"
        - "src/ct2i_benchmark/simulations/sim1_core.py:256-259 — def bayes_risks_x(p_cell, eta) returns (sum p*H_b(eta), sum p*eta*(1-eta)), i.e. R_Brier*(X) = E[eta(1-eta)]"
      consequence: >
        Var{eta(X)} is the CORRECT Brier-scale normaliser and satisfies the exact
        identity Var{eta(X)} = Var(Y) - R_Brier*(X), where Var(Y) = p(1-p) with
        p = E[eta(X)] and R_Brier*(X) = E[eta(1-eta)].
      identity_confirmed_numerically_at_A0_1:
        interpreter: /Users/Eric/.pyenv/versions/3.11.9/bin/python3
        scope: "all 24 (marginal x tau x interaction_pairs x delta_eta) parameter draws at M=5, K=4, d_active=5, replicate 1, exact 1024-state enumeration"
        max_abs_residual_var_eta_identity: 1.1102230246251565e-16
        max_abs_residual_brier_risk_definition: 0.0
        addendum_cells_executed_by_this_check: 0
      do_not_correct: >
        Any future edit replacing Var{eta(X)} with the variance of a linear
        predictor, or with Var(Y), is a defect, not a correction.

    denominator_tolerance:
      frozen_value: 1.0e-6
      applies_to: [relative_log_gap.denominator, relative_brier_gap.denominator]
      rule: >
        If |denominator| < 1.0e-6, the normalized quantity is recorded as
        NOT_IDENTIFIED. NOT_IDENTIFIED is never coerced to 0, never dropped
        silently, never imputed, and never averaged in as any finite value.
        NOT_IDENTIFIED cells are counted and reported separately, and their count
        is subtracted from the effective n of every quantity that uses them.
      justification_one_line: >
        Reuses the inherited tolerances.positive_gap_min = 1.0e-6
        (01_PROTOCOL_FREEZE.yaml:527) — the frozen threshold at which a gap is
        "clearly above numerical noise" — because both denominators ARE
        strictly-positive gap quantities of exactly that kind, so no new
        tolerance constant is introduced into the freeze.
      headroom_measured_at_A0_1: >
        Over the same 24-draw exact grid at d=3 and d=5 (96 denominator values):
        min (H(Y) - R_log*(X)) = 0.00786, max = 0.15314;
        min Var{eta(X)} = 0.00390, max = 0.06728. The smallest observed
        denominator is ~3.9e3 times the tolerance, so NOT_IDENTIFIED is expected
        to be empty in practice; it is frozen as a guard, not as a live branch.
      not_identified_is_not_a_failure: >
        NOT_IDENTIFIED on a normalized quantity does not make the cell a failed
        cell. The raw gap for that cell is still reported.

    stratified_reporting:
      rule: "interaction_pairs = 0 and interaction_pairs = 3 are reported SEPARATELY, never pooled into a single headline number."
      applies_to: [raw estimands, normalized estimands, every D16 clause, every figure panel, every table]
      pooled_number_permitted_only_if: "the pooled number is accompanied, in the same table or caption, by both strata"

    mandatory_confound_disclosure:
      rule: >
        All THREE confounds are RETAINED and PROMINENTLY DISCLOSED wherever a
        d=5 minus d=3 difference is quoted: the A1 validation report, the
        acceptance report, the FigS4_updated caption, every table note, and the
        manuscript.
      confounds:
        - id: C1
          name: total_signal_strength
          statement: "the frozen linear predictor draws one p-centred standard-normal main effect PER ACTIVE COORDINATE with NO normalisation by d, so d=5 carries strictly more signal than d=3 at fixed tau"
          measured: "sd(eta) ratio d5/d3 > 1 in 24 of 24 combinations, range 1.032-1.437 across two replicate windows"
          source: "01A disclosed_confound_signal_strength; S0A_ADDENDUM_PREFLIGHT_REPORT.md section 4a"
        - id: C2
          name: interaction_saturation
          statement: "interaction_pairs is matched by COUNT (3) not by saturation; 3 of C(3,2)=3 is 100% at d=3, 3 of C(5,2)=10 is 30% at d=5"
          source: "01A disclosed_confound_interaction_saturation"
        - id: C3
          name: interaction_placement
          statement: "the three lexicographic pairs differ between the arms: {(0,1),(0,2),(1,2)} at d=3 versus {(0,1),(0,2),(0,3)} at d=5, so every d=5 interaction involves coordinate 0 — the coordinate phi_D collapses — and coordinate 4 is purely additive"
          source: "01A disclosed_confound_interaction_saturation.additional_structural_change_found_at_A0"
      removal_forbidden: "none of C1, C2, C3 may be removed, softened, relegated to an appendix-only footnote, or described as controlled for"

    normalized_analysis_status:
      label: SENSITIVITY_ANALYSIS
      operative_rule: >
        The signal-normalized analysis is a SENSITIVITY ANALYSIS. It must not be
        described as removing, eliminating, adjusting away or controlling for
        confounding. Permitted phrasing: it shows whether the d effect SURVIVES
        normalisation.
      forbidden_phrasings:
        - "removes the confound"
        - "controls for signal strength"
        - "adjusts for the signal-strength confound"
        - "confound-free"
      mechanism_caveat_retained: >
        For the hash encoders the fiber partition is bit-for-bit identical at
        d=3 and d=5 (hash_codes depends on M and K, never on d), so C1 and E1's
        prediction point the SAME way. A confirmation of E1 is therefore not by
        itself evidence for E1's mechanism, and must not be reported as such.
        (01A disclosed_confound_signal_strength.why_it_matters_for_E1.)

  D15:
    title: "Extended raw-freeze manifest coverage; AD10 replacement text"
    status: ACCEPTED_ADVISOR_RULING
    replaces_in_01A:
      - "decisions.D15.status UNRESOLVED_ADVISOR_RULING_REQUIRED -> RESOLVED: extend the manifest AND restate AD10"
      - "acceptance_criteria.AD10.description — the REPLACEMENT TEXT below governs; AD10 in 01A is NOT edited"
    editing_note: >
      AD10 in 01A_ADDENDUM_PROTOCOL_FREEZE.yaml is NOT modified. 01A stays
      byte-identical. The replacement text below is the operative wording of
      AD10 for A1, by the authority split declared in provenance.
    ad10_replacement_text: >
      AD10 (as amended by D15). No protected raw file changed across the A1 run.
      Coverage is defined by reference, not by an inline list: AD10 covers EVERY
      ENTRY ENUMERATED IN RAW_FREEZE_MANIFEST_ADDENDUM.json, which is the
      addendum's own extended manifest and which itself carries every entry of
      the original RAW_FREEZE_MANIFEST.json. For every such entry the SHA-256
      recorded before A1 must equal the SHA-256 recorded after A1. A line-count
      check, a row-count check, a byte-size check or an mtime check is
      INSUFFICIENT and does not satisfy AD10 for any entry.
    coverage_definition:
      authority: RAW_FREEZE_MANIFEST_ADDENDUM.json
      rule: "every entry enumerated therein"
      no_hardcoded_file_list: >
        AD10 must NOT be restated with an inline file list. The manifest is the
        single enumeration; a hardcoded list in the criterion would drift from it.
      manifest_generation_status_at_A0_1: >
        RAW_FREEZE_MANIFEST_ADDENDUM.json is generated by a separate A0.1 work
        item and is referenced here by NAME only. This file does not enumerate
        its contents and does not depend on their order.
      manifest_must_carry_per_entry: [relative_path, sha256, size_bytes, recorded_at_phase]
      superset_requirement: >
        RAW_FREEZE_MANIFEST_ADDENDUM.json must be a strict superset of
        RAW_FREEZE_MANIFEST.json's five entries (05a/05b/05c/05d parquet and
        12_SIM2_RESULTS.csv), and must additionally cover every protected raw CSV
        and every new raw addendum output.
    hash_requirement:
      algorithm: SHA-256
      granularity: per_file
      line_count_check_status: INSUFFICIENT
      why: >
        AT16 currently checks only the LINE COUNT of raw/sim1b_replicates.csv, so
        altered content with an unchanged row count would pass
        (01A acceptance_criteria.AD10.corrected_at_A0_council_review).
    immutability_of_the_original_manifest: >
      RAW_FREEZE_MANIFEST.json is NOT modified, NOT regenerated and NOT
      re-hashed in place. The addendum manifest is a NEW sibling file.
    package_checksum_ordering:
      rule: >
        The final package checksum manifests — PACKAGE_SHA256.json and
        PACKAGE_SHA256SUMS.txt — are generated LAST, after every other A1 output
        exists and is final. Generating them earlier makes them stale and is a
        gate failure.
      inherited_from: "01A outputs.regenerated_last"

  D16:
    title: "E1 split into three separately adjudicated clauses with frozen decision rules"
    status: ACCEPTED_ADVISOR_RULING
    replaces_in_01A:
      - "decisions.D16.status UNRESOLVED_ADVISOR_RULING_REQUIRED -> RESOLVED"
      - "expectations.E1 as a single compound proposition -> three clauses E1a, E1b, E1c"
      - "expectations.E1.decision_rule_required_before_A1 -> satisfied by this block"
    e1_remains_not_an_acceptance_criterion: >
      E1a, E1b and E1c are PRE-REGISTERED EXPECTATIONS, exactly as E1 was. They
      are NOT acceptance criteria and NOT validity gates. 01A
      acceptance_criteria.not_acceptance_criteria [E1, E3, E4] is unchanged and
      now reads as covering E1a, E1b and E1c.
    common_statistic:
      inference: "block-clustered per D13: 8 blocks, 7 df, cluster-robust SE, block-resampling bootstrap"
      contrast: "d = 5 minus d = 3, matched per 01A contrast.matching_key"
      directionality: "one-sided, greater (inherited from 01A expectations.E1.directionality)"
      aggregation: "01A contrast.aggregation — replicates averaged within scenario first; replicates never treated as independent"
      effective_n_disclosure: "mandatory per D13.mandatory_disclosure_per_reported_quantity"
      amendment_3_ref: >
        POINTER ONLY, added 2026-08-24 by AMENDMENT-3; no D16 rule text is
        changed. `inference` above inherits D13's "8 blocks, 7 df", whose
        premise is REFUTED (D13.premise_refuted_at_A0_1). D16's inference line
        therefore follows D13 and is unsettled until the advisor answers
        advisor_confirmation_requested.Q6. Note that
        `directionality: one-sided, greater` is what makes the choice
        consequential: an SE inflated 10-20x manufactures NULL outcomes, and
        outcome_classifications turns those into reported conclusions. See
        D13.consequences_if_D13_is_implemented_as_written.c3.

    clauses:
      E1a:
        encoder: hash_shared
        primary_statistic: "block-clustered d=5 minus d=3 RELATIVE (signal-normalized) LOG-LOSS gap, i.e. the contrast in relative_log_gap as defined in D14.estimands.normalized"
        supporting_statistic: "the parallel block-clustered contrast in relative_brier_gap"
        bucket_width_handling:
          rule: "B0, B1 and B2 COLLAPSE TO ONE piece of evidence"
          why: >
            hash_shared representation loss is IDENTICAL across B0/B1/B2 —
            measured max|B0-B1| == max|B0-B2| == 0.0 on the frozen twin, because
            the shared-value token space holds only K = 4 tokens and B in
            {10, 20, 40} never changes the partition
            (01A contrast.uncertainty.degenerate_bucket_widths_disclosure).
          bh_family_members_contributed: 1
          forbidden: "entering B0, B1 and B2 as three BH family members; that triple-counts one partition"
      E1b:
        encoder: hash_column
        primary_statistic: >
          NARROW-WIDTH statistic: within each scenario, average the B0 and B1
          relative_log_gap contrasts; aggregate those scenario values to block
          means per D13; test the block means one-sided greater.
        averaging_level: "within scenario, then within block — never a pooled average across blocks before clustering"
        widths_averaged: [B0, B1]
        secondary_results:
          rule: "B0, B1 and B2 are ALSO reported SEPARATELY as secondary results"
          status: SECONDARY_NOT_BH_MEMBERS
          significance_claims_permitted: false
        supporting_statistic: "the parallel narrow-width relative_brier_gap contrast"
        bh_family_members_contributed: 1
      E1c:
        encoder: count
        amendment_3_ref: >
          POINTER ONLY, added 2026-08-24 by AMENDMENT-3; no E1c rule text is
          changed. The `fiber_count < 1024` restriction below is a PER-REPLICATE
          event (this clause's own words: "a random sampling-tie event depending
          on replicate and on n_train"), so it is defined per
          (block, replicate, scenario). It CANNOT be applied coherently to 8
          collapsed block means, because a block mean mixes cells that satisfy
          and cells that fail the restriction, and low_power_fallback can then
          fire artefactually. Under the corrected inferential unit — the draw
          (block, replicate), 400 per arm — the restriction applies exactly
          where it is defined. See
          D13.consequences_if_D13_is_implemented_as_written.c4 and
          advisor_confirmation_requested.Q6.
        per_cell_recording_requirement:
          rule: "fiber_count is RECORDED IN EVERY CELL of the addendum output, for every encoder configuration, not only for count"
          gate_ref: "01A acceptance_criteria.AD14 and new_acceptance_criteria.AD15 item 10"
        primary_analysis_restriction:
          rule: >
            The primary analysis includes ONLY MATCHED conditions in which BOTH
            the d=3 mapping and the d=5 mapping are non-injective, i.e.
            fiber_count < 1024 on BOTH sides of the pair.
          state_space: 1024
          state_space_source: "01A exactness.state_space = 4**5 = 1024"
        non_emptiness_verified:
          claim: "`fiber_count < 1024` is a NON-EMPTY condition, not a vacuous restriction"
          verified_line_quoted_from_01A: "01A_ADDENDUM_PROTOCOL_FREEZE.yaml:480 — \"in {576, 768, 1024} and under Zipf in {768, 1024}: the marginal does NOT\""
          full_context: >
            01A expectations.E1.measured_caveat_recorded_at_A0 states that swept
            over many draws the fiber count under uniform takes values in
            {576, 768, 1024} and under Zipf in {768, 1024}. Both sets contain
            values strictly below 1024, so the restriction selects a non-empty
            stratum. The marginal does NOT determine the fiber count: the count
            encoder maps a level to its SAMPLE count, so its merge is a random
            sampling-tie event depending on replicate and on n_train.
          consequence: "the estimand on count is a mixture over whether a tie occurred, and the stratum is identified AFTER the fact from the recorded fiber_count, never assumed from the marginal"
        other_cells:
          rule: "all cells failing the matched non-injective restriction are REPORTED SEPARATELY, never discarded and never pooled into the primary"
          status: SECONDARY_NOT_BH_MEMBERS
        low_power_fallback:
          rule: >
            If too few independent blocks remain after the restriction, E1c is
            reported DESCRIPTIVELY with no significance claim, no p-value and no
            q-value, and it is REMOVED from the BH family (the family then has 2
            members, and that fact is stated).
          frozen_threshold_effective_blocks_min: 4
          advisor_confirmation_ref: advisor_confirmation_requested.Q2   # promoted 2026-08-24; value UNCHANGED and operative
          threshold_justification_one_line: >
            With 3 or fewer surviving block means the cluster-robust t interval
            has <= 2 df and is not usable, so 4 is the smallest count at which a
            significance claim is defensible; frozen now so the threshold cannot
            be chosen after seeing the outcome.
          descriptive_report_must_state: [effective_n_blocks, effective_n_scenario_pairs, point_estimate, block_level_spread, "the explicit sentence that no significance claim is made"]
        bh_family_members_contributed: 1

    bh_family:
      procedure: "Benjamini-Hochberg FDR at 0.05, one-sided greater"
      scope: "the E1 family, nested inside the addendum's own family per 01A decisions.D4; it is NOT folded into the parent freeze's frozen H1-H6 family"
      members_explicit:
        - "E1a: ONE member — hash_shared relative_log_gap contrast, with B0/B1/B2 collapsed to one"
        - "E1b: ONE member — hash_column NARROW-WIDTH (mean of B0 and B1) relative_log_gap contrast"
        - "E1c: ONE member — count relative_log_gap contrast restricted to matched non-injective cells, PRESENT ONLY IF effective_n_blocks >= 4"
      nominal_family_size: 3
      family_size_if_E1c_falls_back: 2
      not_bh_members:
        - "any Brier contrast (supporting/directional evidence only, no q-value)"
        - "any raw (unnormalized) contrast used in the PARTIALLY_SUPPORTED condition"
        - "E1b's separate B0, B1, B2 secondary results"
        - "E1c's non-restricted cells"
        - "any per-stratum (interaction_pairs = 0 / = 3) breakdown"
      forbidden: "expanding the family after seeing q-values; adding members to lower a q; reporting a q for a non-member"

    outcome_classifications:
      status: OUTCOME_SUMMARIES_NOT_VALIDITY_GATES
      loud_notice: >
        CONFIRMED / PARTIALLY_SUPPORTED / NOT_SUPPORTED are OUTCOME SUMMARIES.
        They are NOT validity gates. No acceptance criterion depends on them.
        NULL OR REVERSED FINDINGS MUST BE RETAINED AND REPORTED IN FULL, not
        explained away, not re-cut, not followed by a design change. This is 01A
        expectations.E4, which is binding reporting policy.
      evaluated_per_clause: [E1a, E1b, E1c]
      CONFIRMED:
        conditions_all_required:
          - "the primary NORMALIZED log-loss contrast estimate is POSITIVE"
          - "its one-sided BH-adjusted q < 0.05"
          - "the NORMALIZED Brier contrast is in the SAME (positive) direction"
      PARTIALLY_SUPPORTED:
        conditions_all_required:
          - "the primary NORMALIZED log-loss contrast estimate is POSITIVE"
          - "its one-sided BH-adjusted q >= 0.05"
          - "the RAW log-loss contrast is POSITIVE"
          - "the NORMALIZED Brier contrast is POSITIVE"
      NOT_SUPPORTED:
        conditions_any_sufficient:
          - "the primary NORMALIZED log-loss contrast estimate is non-positive (<= 0)"
          - "the principal risk measures are MATERIALLY DIRECTIONALLY INCONSISTENT"
        materially_directionally_inconsistent_definition:
          advisor_confirmation_ref: advisor_confirmation_requested.Q4   # promoted 2026-08-24; definition UNCHANGED and operative
          rule: >
            The normalized log-loss contrast and the normalized Brier contrast
            have OPPOSITE signs AND both absolute estimates exceed
            positive_gap_min = 1.0e-6. Opposite signs where either magnitude is
            at or below 1.0e-6 are numerical noise, not material inconsistency.
          tolerance_source: "01_PROTOCOL_FREEZE.yaml:527 tolerances.positive_gap_min"
      residual_case:
        advisor_confirmation_ref: advisor_confirmation_requested.Q3     # promoted 2026-08-24; the fourth class is UNCHANGED and operative
        fourth_class_notice: >
          INCONCLUSIVE_REPORTED_IN_FULL is a FOURTH outcome class. The advisor
          specified exactly THREE. See Q3.
        rule: >
          A clause satisfying none of the three condition sets (for example a
          positive normalized estimate with q >= 0.05 but a non-positive raw or
          normalized Brier contrast) is reported as INCONCLUSIVE_REPORTED_IN_FULL
          with all four component estimates printed. It is never rounded up to
          PARTIALLY_SUPPORTED.
      not_identified_handling: >
        A clause whose primary normalized estimate is NOT_IDENTIFIED for any cell
        reports the count of NOT_IDENTIFIED cells and its reduced effective n;
        NOT_IDENTIFIED is never coerced to 0 (D14.denominator_tolerance).

  D17:
    title: "Independent reference check for AD1 and AD2 (AMENDED TWICE 2026-08-24 — see corrects_the_advisor_ruling_as_written)"
    status: ACCEPTED_ADVISOR_RULING_WITH_TWO_CORRECTIONS_PENDING_RATIFICATION
    amended_by: [AMENDMENT-1, AMENDMENT-4]
    amendment_date: 2026-08-24
    what_is_unamended: >
      The advisor's ACCEPTANCE of an independent reference check, his choice of
      sim1_core.reference_gap_report as the independent implementation, his
      sampling rule (all 48 scenarios x all 13 encoder configurations x one
      frozen replicate = 624 cells), his instruction to persist production and
      reference gaps AND their identity errors, and the inherited tolerance are
      ALL UNCHANGED. What is amended is narrower: WHICH of the persisted columns
      the AD1/AD2 verdict is computed from.
    replaces_in_01A:
      - "decisions.D17.status UNRESOLVED_ADVISOR_RULING_REQUIRED -> RESOLVED"
      - "acceptance_criteria.AD1.circularity_warning_from_the_A0_council_review — the remedy below is now MANDATORY, not recommended"
      - "acceptance_criteria.AD2.circularity_warning — same"
    problem_restated: >
      `exact_gap_report` computes the risk difference and the theoretical gap
      from the SAME `fiber_posteriors` aggregation, and the 1B runner stores
      theoretical_gap = representation_loss, so an identity error recomputed from
      stored columns is ~1e-16 BY CONSTRUCTION (measured 1.28e-16 on the frozen
      twin). AD1 and AD2 would pass whatever the fiber algebra does.
    reference_implementation:
      symbol: sim1_core.reference_gap_report
      verified_location: "src/ct2i_benchmark/simulations/sim1_core.py:332"
      verified_signature: "reference_gap_report(fid, p_cell, eta) -> dict"
      existence_verified_at_A0_1: true
      independence_property: >
        Shares no code with the fast path: pure-Python dict grouping, `math`
        rather than numpy reductions, no bincount, no `fiber_posteriors`
        (docstring at sim1_core.py:332-346).
      keys_returned_used_here: [gap_logloss, gap_brier, identity_error_logloss, identity_error_brier]
      fast_path_counterpart: "src/ct2i_benchmark/simulations/sim1_core.py:309 exact_gap_report"
    sampling_rule:
      status: DETERMINISTIC_FROZEN_NO_IMPLEMENTER_DISCRETION
      scenarios: "ALL 48 addendum scenarios, S1BD-0001 .. S1BD-0048"
      encoder_configurations: "ALL 13 configurations (7 non-hash + 2 hash x 3 bucket widths), per 01A design.encoders.configuration_count"
      replicates_per_scenario: 1
      frozen_replicate_rule:
        rule: "reference_replicate(scenario) = int(scenario_id[-4:])"
        plain_statement: >
          The frozen replicate for scenario S1BD-XXXX is the integer XXXX, i.e.
          scenario S1BD-0001 uses replicate 1, S1BD-0002 uses replicate 2, ...,
          S1BD-0048 uses replicate 48.
        replicate_index_base_verified: >
          Replicate indices are 1-based in this package: the frozen
          05b_SIM1B_REPLICATE_RESULTS.parquet at M=5, K=4 has replicate.min()==1,
          replicate.max()==50, replicate.nunique()==50 (read-only check at A0.1).
        in_range: "1 <= 48 <= 50, so every scenario's frozen replicate exists"
        why_not_replicate_1_for_all: >
          Fixing one replicate index across all scenarios would probe a single
          slice of the replicate axis. Tying the index to the scenario ordinal is
          equally deterministic, requires no randomness, and spreads the check
          over 48 distinct replicate indices.
        no_discretion: "the implementer chooses nothing; the rule is a pure function of the scenario id"
      cell_count: 624
      cell_count_derivation: "48 scenarios x 13 configurations x 1 replicate = 624"
      minimum_required: 624
      satisfies_minimum: true
      expansion_rule: "the sample may not be reduced; it may only be enlarged, and any enlargement must be a superset stated before the run"
    persisted_columns:
      requirement: "SIX columns persisted per reference cell, as data, never as prose"
      columns:
        - name: reference_log_gap
          source: "reference_gap_report(...)['gap_logloss']"
        - name: reference_brier_gap
          source: "reference_gap_report(...)['gap_brier']"
        - name: production_log_gap
          source: "the production/fast path value for the same cell (exact_gap_report / the runner's stored representation-loss route)"
        - name: production_brier_gap
          source: "the production/fast path value for the same cell"
        - name: log_identity_error
          source: "reference_gap_report(...)['identity_error_logloss'] — the genuine |(R_log(Z)-R_log(X)) - I(Y;X|Z)| computed inside the independent implementation"
          classification: DESCRIPTIVE_NOT_GATING       # AMENDMENT-1, 2026-08-24
          retained_because: "the advisor named this column; it stays mandatory and persisted"
          why_not_gating: "measured insensitive to injected production defects — see measured_sensitivity_at_A0_1"
        - name: brier_identity_error
          source: "reference_gap_report(...)['identity_error_brier'] — the genuine |(R_bri(Z)-R_bri(X)) - E[Var(eta|Z)]| computed inside the independent implementation"
          classification: DESCRIPTIVE_NOT_GATING       # AMENDMENT-1, 2026-08-24
          retained_because: "the advisor named this column; it stays mandatory and persisted"
          why_not_gating: "measured insensitive to injected production defects — see measured_sensitivity_at_A0_1"
        - name: recomputed_fiber_count                 # ADDED by AMENDMENT-1
          source: "the number of distinct fibers in the partition the checker REBUILDS from (M, K, marginal, tau, interaction_pairs, delta_eta, seed, encoder, bucket_width)"
          classification: GATING
        - name: stored_fiber_count                     # ADDED by AMENDMENT-1
          source: "the fiber_count written by the production runner for the same cell"
          classification: GATING
        - name: fiber_count_match                      # ADDED by AMENDMENT-1
          source: "1 if recomputed_fiber_count == stored_fiber_count, else 0; NULL only where the production row carries no fiber_count"
          classification: GATING
          why_this_column_exists: >
            BOTH the production path and sim1_core.reference_gap_report are
            handed the SAME fiber id vector `fid`, so a defect in fiber
            CONSTRUCTION (group_ids, hash_codes, ebar_coordinatewise) makes both
            sides consistently wrong and the production-versus-reference
            comparison stays at ~1e-15. This is exactly the failure class the
            docstring at sim1_core.py:332-346 warns about. A structurally
            independent detector is therefore required, and the recomputed
            partition's cardinality is one.
        - name: stored_representation_loss_log_mc     # GATING from AMENDMENT-4
          source: "the production runner's stored `representation_loss` for the log-loss row of the same cell"
          classification: GATING
        - name: stored_representation_loss_brier_mc    # GATING from AMENDMENT-4
          source: "the production runner's stored `representation_loss` for the Brier row of the same cell"
          classification: GATING
        - name: stored_mcse_log                        # ADDED by AMENDMENT-4
          source: "the production runner's stored `mcse` for the log-loss row of the same cell"
          classification: GATING
        - name: stored_mcse_brier                      # ADDED by AMENDMENT-4
          source: "the production runner's stored `mcse` for the BRIER row of the same cell. The log-loss mcse is ~2x the Brier one (measured median ratio 2.08 on the frozen d = 3 arm), so reusing it would slacken the Brier gate by that factor."
          classification: GATING
        - name: stored_mc_tolerance_log                # ADDED by AMENDMENT-4
          source: "6 * stored_mcse_log + 1.0e-9 — the gate 3 budget for this cell, persisted so the verdict is re-derivable from the CSV alone"
          classification: GATING
        - name: stored_mc_tolerance_brier              # ADDED by AMENDMENT-4
          source: "6 * stored_mcse_brier + 1.0e-9"
          classification: GATING
        - name: stored_mc_within_tolerance             # ADDED by AMENDMENT-4
          source: "1 if BOTH stored representation losses are within their budgets, else 0; NULL where the production row carries no representation loss or no mcse — NULL is never counted as a pass"
          classification: GATING
        - name: fiber_fingerprint                      # ADDED by AMENDMENT-4
          source: "sim1_core.partition_fingerprint(fid), written by the A1 runner on every SUCCESS row from the very `fid` that row's population layer was computed under"
          classification: GATING
          new_runner_column: true
        - name: recomputed_fiber_fingerprint           # ADDED by AMENDMENT-4
          source: "the same digest, computed by the checker from the partition it REBUILDS independently of the runner"
          classification: GATING
        - name: fiber_fingerprint_match                # ADDED by AMENDMENT-4
          source: "1 if the two digests are equal as strings, else 0; NULL only where the production row carries no fingerprint"
          classification: GATING
          why_this_column_exists: >
            `fiber_count` is INVARIANT under fiber relabelling and under any
            cardinality-preserving assignment defect: a permutation of the
            cell -> fiber assignment, or a swap of one cell between two fibers,
            preserves the fiber count AND the entire multiset of fiber sizes.
            The digest is canonical (fibers relabelled in order of first
            appearance, i.e. sorted by smallest cell index, then hashed), so it
            is equal if and only if the PARTITIONS are equal. It shares no code
            with group_ids, hash_codes, quantize or np.unique — the helpers
            whose defects it exists to detect.
      keying_columns_also_required: [scenario_id, replicate, encoder, bucket_width, width_label, d_active]
      forbidden: >
        Deriving any of the six from stored production columns that share one
        aggregation. The reference columns must come from
        `sim1_core.reference_gap_report` executed on the cell.
    evaluation_rule:
      amended_by: AMENDMENT-1
      amendment_date: 2026-08-24
      superseded_wording_recorded_for_the_record:
        v1_text: >
          "ad1_ad2_are_evaluated_against: the reference columns, not the
          production self-check; tolerance_ref: exact_identity_abs = 1.0e-10;
          also_required: |production_log_gap - reference_log_gap| and
          |production_brier_gap - reference_brier_gap| are reported and must
          also satisfy exact_identity_abs."
        why_superseded: >
          "the reference columns" was read as including the two identity-error
          columns, and those are measured to be blind to production defects of
          size 1e-2. The v1 wording also placed the production-versus-reference
          comparison under `also_required`, i.e. as an addition rather than as
          the gate. AMENDMENT-1 inverts that emphasis and adds the
          fiber-construction detector the comparison cannot supply.
      ad1_ad2_gating_rule:
        semantics: CONJUNCTIVE_BOTH_MUST_PASS
        tolerance_ref: "exact_identity_abs = 1.0e-10 (01_PROTOCOL_FREEZE.yaml:525), UNCHANGED by AMENDMENT-1 and UNCHANGED by AMENDMENT-4"
        tolerance_classes:               # ADDED by AMENDMENT-4
          note: >
            `tolerance_ref` above names ONE tolerance class, and it does not
            cover every gate. AMENDMENT-4 states this explicitly rather than
            letting a reader assume exact_identity_abs governs all four gates.
          G1: "exact_identity_abs = 1.0e-10 — exact against exact"
          G2: "no tolerance; integer equality of a count"
          G3: "MCSE-SCALED, 6 * stored_mcse + 1.0e-9. A NEW TOLERANCE CLASS, introduced by AMENDMENT-4, which the advisor's ruling does not mention and which the inherited freeze does not contain. It is not derived from 01_PROTOCOL_FREEZE.yaml `tolerances`; it is derived from the stored quantity's own standard error."
          G4: "no tolerance; string equality of a canonical digest"
          why_a_second_class_is_unavoidable: >
            G3 compares a Monte-Carlo estimate against an exact number. No
            constant absolute tolerance can be both tight enough to detect a
            defect and loose enough to pass a correct run, because the MC error
            varies by four orders of magnitude across the sample (mcse 0 to
            6.8e-4). A tolerance proportional to the estimate's own standard
            error is the only one that adapts, and it is the standard
            construction for exactly this comparison.
        gate_G1_production_versus_reference:
          statement: >
            In EVERY reference cell, |production_log_gap - reference_log_gap|
            <= 1.0e-10 AND |production_brier_gap - reference_brier_gap|
            <= 1.0e-10, where the reference values come from
            sim1_core.reference_gap_report executed on the cell and NEVER from
            any stored production column.
          detects: "defects in the fiber ALGEBRA — conditional means, fiber masses, risk aggregation"
          measured_discriminating_power: "fires at 5.5e4 x tolerance under ebar_bias and 1.1e8 x tolerance under mass_dropout"
        gate_G2_fiber_construction_cross_check:
          statement: >
            In EVERY reference cell for which a production fiber_count exists,
            recomputed_fiber_count == stored_fiber_count exactly (integer
            equality; no tolerance applies to a count).
          detects: "defects in fiber CONSTRUCTION, which G1 is structurally blind to because both paths consume the same fid"
          measured_discriminating_power: "0/624 match under fiber_merge, while G1 stays at 6.2e-15 and does not fire"
          applicability: >
            G2 is evaluable only against an arm whose production rows are on
            disk. This is why the D17 check must run AFTER the A1 runner, against
            the runner's output — not before it. See advisor_confirmation_requested.Q1.
        gate_G3_stored_representation_loss:
          added_by: AMENDMENT-4
          statement: >
            In EVERY reference cell for which the production row carries a
            representation loss and an mcse, for BOTH metrics separately,
            |stored_representation_loss - recomputed exact population gap|
            <= 6 * stored_mcse + 1.0e-9.
          detects: >
            defects in the cell -> fiber ASSIGNMENT, which G1 and G2 are both
            structurally blind to. The stored representation loss is the
            runner's Monte-Carlo risk under the partition the runner ACTUALLY
            used (ebar_cells[ev_cell]), while the recomputed gap comes from the
            checker's own rebuilt partition, so this is the only comparison in
            D17 that crosses the fiber-construction boundary.
          tolerance_class: MCSE_SCALED_NOT_EXACT_IDENTITY_ABS
          why_not_the_frozen_tolerance: >
            The stored column is a Monte-Carlo plug-in over the evaluation
            sample, not an exact population number: it differs from the exact
            gap by up to 1.07e-3 on a CORRECT implementation. Gating it at
            exact_identity_abs = 1.0e-10 would fail a correct run. See
            representation_loss_is_monte_carlo.
          why_k_equals_6: >
            The stored quantity is a sample mean whose standard error is the
            stored mcse, so k is a number of standard errors. k = 6 is the
            same constant the runner-level AD1/AD2 property test uses
            (tests/test_a0_2_defect_closure.AD12_K). Measured on the 624 clean
            cells of the frozen d = 3 arm the worst cell used 0.592 of its
            budget (i.e. 3.55 mcse); at k = 3 two clean cells would fail, so
            k = 6 is the first round margin that a correct run clears
            everywhere, and it was NOT chosen after seeing a failure.
          why_the_floor: >
            202 of the 624 clean cells have mcse exactly 0 and others have it
            denormal (min 2.4e-20), because the injective encoders satisfy
            ebar == eta pointwise. Their observed |difference| is at most
            2.2e-16, so the 1.0e-9 floor is four orders of magnitude tighter
            than exact_identity_abs would have been generous, and it avoids
            dividing by zero.
          measured_discriminating_power: >
            clean 624/624 within budget; under fiber_permute 166 of 624 cells
            fire, the worst at 2.1e4 x its budget, while G1 stays at 5.4e-15
            and G2 at 624/624; under fiber_swap 6 of 624 fire, the worst at
            3.5e5 x budget, again with G1 and G2 clean.
          applicability: "as G2 — evaluable only against an arm whose production rows are on disk. On the A1 gate arm a cell count of zero is a FAILURE, not an inapplicable gate."
        gate_G4_partition_fingerprint:
          added_by: AMENDMENT-4
          statement: >
            In EVERY reference cell for which the production row carries a
            `fiber_fingerprint`, that digest equals the digest of the partition
            the checker rebuilds, as strings. No tolerance: a digest is either
            equal or it is not.
          detects: "the SAME class as G3, exactly rather than statistically"
          tolerance_class: EXACT_STRING_EQUALITY_NO_TOLERANCE
          why_G3_is_not_enough: >
            G3's tolerance is the Monte-Carlo noise floor, so an assignment
            defect whose effect on the population gap is smaller than 6 mcse
            survives it. MEASURED on the frozen d = 3 arm: a one-cell swap
            moved the population gap in 151 cells and G3 fired in only 6 of
            them, NONE of them a hash configuration — a swap confined to the
            hash configurations would have passed the whole 624-cell sample
            while corrupting gaps by up to 1.4e-3. At d = 5 this matters more,
            not less: all seven coordinate-wise encoders are injective at
            M = K**d, so the SIX HASH CONFIGURATIONS ARE THE ONLY ONES WITH A
            NON-TRIVIAL PARTITION, and they are exactly where G3 is weakest
            (their mcse is the largest on the arm). G4 fired on 295 of 624
            under the same swap and on 297 of 624 under the permutation —
            precisely the cells whose partition actually changed, with zero
            false positives on the clean run.
          measured_discriminating_power: "clean 624/624; fiber_permute 297/624 mismatches; fiber_swap 295/624 mismatches; G1 and G2 clean throughout"
          does_not_fire_on_a_relabelling: >
            Permuting an ALL-SINGLETON assignment yields the SAME partition, so
            the digest is unchanged. That is correct, not a blind spot: there
            is nothing to detect. It is also why council-Claude's attack A3b
            was numerically inert on the coordinate-wise encoders at d = 5.
          cost: "one new persisted string column on the A1 runner (32 hex characters per SUCCESS row) and one blake2b pass over 1,024 cells per encoder configuration"
          applicability: >
            Evaluable only where the production row carries the column. The
            frozen d = 3 twin's parquet PREDATES it, so G4 reports
            NOT_EVALUATED there; on the A1 gate arm its absence means the
            runner did not write it, which is a non-conforming run and is
            reported as a FAILURE.
        verdict: "AD1 and AD2 PASS if and only if G1, G2, G3 and G4 ALL pass over the full frozen sample: zero cells over the exact tolerance, zero fiber_count mismatches, zero stored representation losses outside their MCSE-scaled budgets, and zero partition-fingerprint mismatches."
      descriptive_not_gating:
        columns: [log_identity_error, brier_identity_error, production_self_identity_error_log, production_self_identity_error_brier]
        rule: >
          These are PERSISTED AND REPORTED but carry NO verdict. AD1/AD2 must
          NEVER be reported as "passed" on the strength of the identity-error
          columns. A report quoting only a small identity error as evidence that
          AD1/AD2 passed is non-conforming.
        why: >
          reference_gap_report defines ebar_f as its OWN mass-weighted
          within-fiber mean, so R_log(Z) - R_log(X) = I(Y;X|Z) telescopes
          EXACTLY inside that implementation (likewise Brier and E[Var(eta|Z)]).
          Its internal identity error is a self-check of the SAME CLASS as the
          production self-check the ruling was written to escape, and it stays
          at ~5e-15 no matter how wrong the production number is.
      harness_superset_note: >
        scripts/s0b_reference_gap_check.py currently folds the two identity
        errors into its per-cell `worst` statistic alongside the two
        production-versus-reference differences. That is a strict SUPERSET of
        gate G1 and can only make the gate harder to pass, so it is conforming
        and NO harness change is required by this amendment. What is prohibited
        is the converse: computing the verdict from the identity errors ALONE.

    measured_sensitivity_at_A0_1:
      why_this_block_exists: >
        Recorded so that no future reader re-litigates the reclassification. The
        question "do the two named identity-error columns detect a broken
        production path?" was ANSWERED BY MEASUREMENT, not by argument.
      source_report: simulation-results-ct2i/S0B_REFERENCE_IMPLEMENTATION_TEST_REPORT.md
      harness: scripts/s0b_reference_gap_check.py
      interpreter: /Users/Eric/.pyenv/versions/3.11.9/bin/python3
      arm_used: "the EXISTING FROZEN d = 3 arm (production values already on disk); ZERO addendum cells executed"
      method: >
        Five defects injected as IN-PROCESS MONKEYPATCHES of sim1_core (three at
        AMENDMENT-1, two more at AMENDMENT-4). No source file edited, no repo
        copy made, every perturbed CSV written outside the package and deleted.
      how_to_read_the_partition_fingerprint_rows: >
        ADDED BY AMENDMENT-5. Every `partition_fingerprint` (G4) count in this
        table was obtained through
        scripts/s0b_g4_fingerprint_bite.py, NOT through the plain
        s0b_reference_gap_check.py commands. 05b_SIM1B_REPLICATE_RESULTS.parquet
        predates the fiber_fingerprint column, so on the only arm that exists the
        plain commands report fingerprint_checked=0 and
        G4_partition_fingerprint:NOT_EVALUATED. The driver supplies G4's missing
        precondition explicitly: it builds the stored fingerprint map from the
        CLEAN recomputed digests in S0B_REFERENCE_GAP_CHECK_d3_frozen.csv —
        exactly what a conforming A1 runner would have written — and injects it
        into load_stored in-process. Every other column in this table (G1, G2,
        G3, both identity errors) IS obtained end-to-end from the plain
        commands. G4's first evaluation against real production output is on
        A1's own rows. See a0_1_verification.V12.
      tolerance: 1.0e-10
      clean_run:
        cells: 624
        max_log_identity_error: 5.447e-15
        max_brier_identity_error: 2.050e-15
        max_abs_production_minus_reference: 5.551e-15
        fiber_count_matches: "624/624"
        cells_with_a_non_degenerate_gap: "295/624 carry |gap| > 1e-6, so the check is not passing on an all-zero sample"
        verdict: PASS
      injected_defects:
        - defect: ebar_bias
          what_it_corrupts: "conditional means — fiber_posteriors returns ebar x (1 + 1e-6)"
          log_identity_error: "5.447e-15 — UNCHANGED, DOES NOT FIRE"
          brier_identity_error: "UNCHANGED, DOES NOT FIRE"
          abs_production_minus_reference: "5.541e-07 — FIRES, 5.5e4 x tolerance"
          fiber_count_match: "624/624 — does not fire (construction is intact)"
          caught_by: [G1]
        - defect: mass_dropout
          what_it_corrupts: "fiber masses — the lightest positive-mass fiber's mass is zeroed"
          log_identity_error: "5.447e-15 — UNCHANGED, DOES NOT FIRE"
          brier_identity_error: "UNCHANGED, DOES NOT FIRE"
          abs_production_minus_reference: "1.083e-02 — FIRES, 1.1e8 x tolerance"
          fiber_count_match: "624/624 — does not fire (construction is intact)"
          caught_by: [G1]
        - defect: fiber_merge
          what_it_corrupts: "fiber GROUPING — group_ids returns fid // 2, halving every partition"
          log_identity_error: "UNCHANGED, DOES NOT FIRE"
          brier_identity_error: "UNCHANGED, DOES NOT FIRE"
          abs_production_minus_reference: "6.2e-15 — DOES NOT FIRE (both paths consume the same fid)"
          fiber_count_match: "0/624 — FIRES"
          caught_by: [G2]
        - defect: fiber_permute                      # ADDED by AMENDMENT-4
          what_it_corrupts: "the cell -> fiber ASSIGNMENT — the rebuilt partition is rolled by one cell, which preserves the fiber count and the entire multiset of fiber sizes"
          log_identity_error: "5.402e-15 — UNCHANGED, DOES NOT FIRE"
          brier_identity_error: "2.113e-15 — UNCHANGED, DOES NOT FIRE"
          abs_production_minus_reference: "5.440e-15 — DOES NOT FIRE (both paths consume the same fid)"
          fiber_count_match: "624/624 — DOES NOT FIRE (a permutation preserves the count exactly)"
          stored_representation_loss: "166/624 cells OUTSIDE 6*mcse + 1e-9, worst cell at 2.1e4 x its budget — FIRES"
          partition_fingerprint: "297/624 mismatches — FIRES on every cell whose partition actually changed"
          caught_by: [G3, G4]
