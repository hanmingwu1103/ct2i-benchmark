# FROZEN CPU pilot matrix (P-D-CPU). DRAFT until the microbenchmark stamps the
# projection block below; frozen BEFORE any pilot metric is read.
# CPU diagnostic resolution 64x64; ResNet-18 smoke-only; GPU hours = 0.

datasets: [tictactoe, mushroom, bace, parity5_plus_5]
n_outer_folds: 5
seeds:
  fold: 42
  inner: 421
  oof: 4211
  layout: 7

image:
  encoders: [label, onehot, target, hash_column, hash_shared]
  layouts: [igtd_reimpl, bie, bargraph]   # bargraph auto-skipped over pixel cap
  reader: pca_mlp
  seeds: [1042, 2042]                     # two PCA+MLP seeds
  diag_resolution: 64

representation:
  encoders: [label, onehot, target, hash_column, hash_shared]
  models: [logistic, lightgbm, xgboost, direct_mlp]
  mlp_seeds: [5, 6]                       # two direct-MLP seeds

best_practice:
  models:
    - {model: catboost_native, encoder: null, seeds: [5]}
    - {model: tabm, encoder: onehot, seeds: [5, 6]}   # model-appropriate numeric input; onehot fitted fold-safe
    - {model: tabicl_v2, encoder: label, seeds: [5]}  # fixed inference config, CPU
    # tabpfn_3 cells are emitted as MODEL_ACCESS_NOT_AUTHORIZED (license flow declined)

unavailable_models:
  tabpfn_3: MODEL_ACCESS_NOT_AUTHORIZED

timeouts:                # per-operation caps (<= §7.2 defaults)
  image_cell_s: 900
  tabular_cell_s: 600
  foundation_cell_s: 900

pixel_cap: 262144
onehot_width_cap: 1500

pa_comparison:
  datasets: [tictactoe, mushroom, bace, parity5_plus_5]
  n_folds: 2                     # compact frozen subset (sized from microbenchmark)
  encoders: [target, label]      # one supervised + one label-free scaler exposure
  layouts: [igtd_reimpl, bie]
  seed: 1042
  timeout_s: 900

# ---- projection block: stamped from the measured CPU microbenchmark
# (_tmp/microbenchmark_rows.csv) BEFORE any pilot metric was read ----
projection:
  stamped: true
  basis: "per-op medians: BACE target-encode 14.1s, BACE igtd-fit 21.3s, tabicl bace 229s / mushroom 56s, tabm mushroom 12.8s, pca_mlp <=1.1s, gbdt <=0.3s"
  total_cells_incl_ineligible: 1200
  expected_skipped_ineligible: "~105 (bargraph+onehot over caps on bace)"
  projected_pilot_elapsed_hours: 4.5
  projected_pa_elapsed_hours: 0.8
  projected_sim_elapsed_hours: 0.3
  projected_total_elapsed_hours: 5.6      # cap 24 -> WITHIN
  projected_cpu_core_hours: 30            # cap 192 -> WITHIN (<=4 threads/op)
  projected_peak_disk_gb: 2.5             # cap 30 -> WITHIN
  shrink_rule_applied: "P-A folds reduced 5->2 (order §7.3: candidate/scope reduction before dataset drops); no dataset dropped; no P-B/P-C reduction"
